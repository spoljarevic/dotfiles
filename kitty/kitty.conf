# vim:ft=kitty
# -------------------------------------------------
# Dark navy / space theme
# -------------------------------------------------
# Colors sampled directly from a reference screenshot (dark navy background,
# soft lavender text, blue/orange/green/pink accents). Layout/content of that
# screenshot is unrelated — only the colors were matched.
#
# Transparency – 0.0 = fully transparent, 1.0 = opaque
background_opacity 0.85

# -------------------------------------------------
# Core colors
# -------------------------------------------------
foreground              #c4d0f6
background              #101323
selection_foreground    #101323
selection_background    #c4d0f6

# -------------------------------------------------
# Cursor
# -------------------------------------------------
cursor                  #ffffff
cursor_text_color       #101323

# -------------------------------------------------
# URL underline (mouse hover)
# -------------------------------------------------
url_color               #58a4f2

# -------------------------------------------------
# Window border
# -------------------------------------------------
active_border_color     #58a4f2
inactive_border_color   #303652
bell_border_color       #f6b985

# -------------------------------------------------
# Titlebars (Wayland / macOS)
# -------------------------------------------------
wayland_titlebar_color  system
macos_titlebar_color    system

# -------------------------------------------------
# Tab bar
# -------------------------------------------------
active_tab_foreground   #101323
active_tab_background   #58a4f2
inactive_tab_foreground #808ab1
inactive_tab_background #171a2c
tab_bar_background      #0b0d1a

# -------------------------------------------------
# Marks (text selections)
# -------------------------------------------------
mark1_foreground #101323
mark1_background #58a4f2
mark2_foreground #101323
mark2_background #f6b3f2
mark3_foreground #101323
mark3_background #9df288

# -------------------------------------------------
# 16-color palette
# -------------------------------------------------
# black
color0  #303652
color8  #45495f

# red
color1  #f28fa3
color9  #f6a9b8

# green
color2  #9df288
color10 #b3f6a0

# yellow
color3  #f6b985
color11 #fcc99a

# blue
color4  #58a4f2
color12 #7db8f5

# magenta
color5  #f6b3f2
color13 #f9c8f7

# cyan
color6  #7dd3fc
color14 #9adfff

# white
color7  #c4d0f6
color15 #dde3fb

# -------------------------------------------------
# Multiplexing (tmux replacement)
# -------------------------------------------------
# "splits" gives directional panes like tmux; "stack" lets you zoom one
# pane fullscreen and flip back (bound to ctrl+shift+z below).
enabled_layouts splits,stack,tall

# Lets `kitty @ ...` script windows/tabs/layouts from the outside
# (needed for anything beyond what a keybinding can do, e.g. save/restore).
allow_remote_control yes
listen_on unix:@mykitty

# Open a plain new pane in the current layout
map ctrl+shift+enter launch --cwd=current
# tmux '%' / '"' equivalents: explicit directional splits
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current

# Move focus between panes (tmux prefix+arrow)
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# Resize the focused pane: arrow keys to adjust, enter/esc to confirm
map ctrl+shift+r start_resizing_window

# Zoom the focused pane fullscreen and back (tmux prefix+z)
map ctrl+shift+z toggle_layout stack

# Broadcast keystrokes to every pane in the tab (tmux synchronize-panes)
map ctrl+shift+e kitten broadcast

# Recreate a default pane layout on launch (layout only, not running
# processes — kitty has no background server to persist those, unlike
# tmux's detach/reattach). Edit or delete session.conf to change/disable.
startup_session session.conf

