# Default startup layout, run automatically via `startup_session` in kitty.conf.
# Recreates a split layout each launch — not saved/restored state, just a
# starting point. Edit the commands/paths below or delete the file and the
# startup_session line in kitty.conf to boot into a single plain window instead.

# Tab 1: productivity — nvim + shell + claude (this is the frontmost tab on launch)
new_tab productivity
layout splits
launch --title nvim --cwd=current nvim
launch --title shell --location=hsplit --bias=35 --cwd=current --hold fastfetch
focus
launch --title claude --location=vsplit --cwd=current claude

# Tab 2: plain terminal, split it further with Ctrl+Shift+- / Ctrl+Shift+\
new_tab terminal
layout splits
